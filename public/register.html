<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Register – MyStorage</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/dashboard.css" />
  <link rel="stylesheet" href="/css/responsive.css" />
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-logo">☁ MyStorage</div>
      <p class="auth-subtitle">Create your free account · 20 GB storage</p>

      <form id="registerForm" novalidate>
        <div class="form-group">
          <label class="form-label" for="username">Username</label>
          <input class="form-input" type="text" id="username" name="username" autocomplete="username" required placeholder="johndoe" minlength="2" maxlength="50" />
          <div class="form-error" id="usernameError"></div>
        </div>
        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <input class="form-input" type="email" id="email" name="email" autocomplete="email" required placeholder="you@example.com" />
          <div class="form-error" id="emailError"></div>
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input class="form-input" type="password" id="password" name="password" autocomplete="new-password" required placeholder="Min. 8 characters" minlength="8" />
          <div class="form-error" id="passwordError"></div>
        </div>
        <div class="form-group">
          <label class="form-label" for="confirmPassword">Confirm Password</label>
          <input class="form-input" type="password" id="confirmPassword" name="confirmPassword" autocomplete="new-password" required placeholder="Repeat password" />
          <div class="form-error" id="confirmError"></div>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%" id="submitBtn">
          Create Account
        </button>
      </form>

      <p class="auth-footer">
        Already have an account? <a href="/login">Login</a>
      </p>
    </div>
  </div>

  <script src="/js/auth.js"></script>
  <script>
    redirectIfAuth();

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const btn = document.getElementById('submitBtn');

      ['usernameError','emailError','passwordError','confirmError'].forEach(id => {
        document.getElementById(id).textContent = '';
      });

      let valid = true;
      if (username.length < 2) {
        document.getElementById('usernameError').textContent = 'Username must be at least 2 characters';
        valid = false;
      }
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        document.getElementById('emailError').textContent = 'Enter a valid email';
        valid = false;
      }
      if (password.length < 8) {
        document.getElementById('passwordError').textContent = 'Password must be at least 8 characters';
        valid = false;
      }
      if (password !== confirmPassword) {
        document.getElementById('confirmError').textContent = 'Passwords do not match';
        valid = false;
      }
      if (!valid) return;

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>';

      try {
        const res = await API.post('/api/auth/register', {
          username, email, password, confirmPassword
        });
        if (res.data && res.data.token) {
          localStorage.setItem('token', res.data.token);
        }
        showToast('Account created!', 'success');
        window.location.href = '/dashboard';
      } catch (err) {
        showToast(err.message || 'Registration failed', 'error');
        btn.disabled = false;
        btn.textContent = 'Create Account';
      }
    });
  </script>
</body>
</html>
