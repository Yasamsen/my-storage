<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login – MyStorage</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/dashboard.css" />
  <link rel="stylesheet" href="/css/responsive.css" />
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-logo">☁ MyStorage</div>
      <p class="auth-subtitle">Sign in to your account</p>

      <form id="loginForm" novalidate>
        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <input class="form-input" type="email" id="email" name="email" autocomplete="email" required placeholder="you@example.com" />
          <div class="form-error" id="emailError"></div>
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input class="form-input" type="password" id="password" name="password" autocomplete="current-password" required placeholder="••••••••" />
          <div class="form-error" id="passwordError"></div>
        </div>
        <div class="form-group flex justify-between items-center">
          <label class="form-check">
            <input type="checkbox" id="remember" name="remember" />
            Remember me
          </label>
          <a href="#" class="text-sm" style="pointer-events:none;opacity:.5" title="Coming soon">Forgot password?</a>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%" id="submitBtn">
          Login
        </button>
      </form>

      <p class="auth-footer">
        Don't have an account? <a href="/register">Register</a>
      </p>
    </div>
  </div>

  <script src="/js/auth.js"></script>
  <script>
    redirectIfAuth();

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const remember = document.getElementById('remember').checked;
      const btn = document.getElementById('submitBtn');

      document.getElementById('emailError').textContent = '';
      document.getElementById('passwordError').textContent = '';

      if (!email) {
        document.getElementById('emailError').textContent = 'Email is required';
        return;
      }
      if (!password) {
        document.getElementById('passwordError').textContent = 'Password is required';
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>';

      try {
        const res = await API.post('/api/auth/login', { email, password, remember });
        if (res.data && res.data.token) {
          localStorage.setItem('token', res.data.token);
        }
        if (res.data && res.data.user && res.data.user.theme) {
          applyTheme(res.data.user.theme);
        }
        showToast('Login successful', 'success');
        window.location.href = '/dashboard';
      } catch (err) {
        showToast(err.message || 'Login failed', 'error');
        btn.disabled = false;
        btn.textContent = 'Login';
      }
    });
  </script>
</body>
</html>
